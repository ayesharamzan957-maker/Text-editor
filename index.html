<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Styling App</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            color: #222;
            text-align: center;
            padding: 20px;
            transition: 0.3s;
        }

        h1 {
            color: #2563eb;
        }

        .container {
            max-width: 800px;
            margin: auto;
            padding: 20px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 12px #cccccc;
        }

        #textArea {
            padding: 25px;
            margin: 20px 0;
            background-color: #ffffff;
            color: #000000;
            border: 2px solid #cccccc;
            border-radius: 8px;
            font-size: 20px;
            text-align: center;
            transition: 0.3s;
        }

        .buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        button {
            padding: 10px 14px;
            border: none;
            border-radius: 6px;
            background-color: #2563eb;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        .reset {
            background-color: #dc2626;
        }

        .reset:hover {
            background-color: #b91c1c;
        }

        .dark {
            background-color: #1f2937;
            color: white;
        }

        .dark .container {
            background-color: #374151;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Interactive Text Styling App</h1>

        <p>Click the buttons to change the appearance of your text.</p>

        <div id="textArea">
            Welcome to JavaScript!
            <br>
            You can change my appearance.
        </div>

        <div class="buttons">

            <!-- Change Text Color -->
            <button onclick="changeColor('red')">Red Text</button>
            <button onclick="changeColor('blue')">Blue Text</button>
            <button onclick="changeColor('green')">Green Text</button>

            <!-- Change Font Size -->
            <button onclick="changeSize(2)">A+ Increase</button>
            <button onclick="changeSize(-2)">A- Decrease</button>

            <!-- Change Font Family -->
            <button onclick="changeFont('Arial')">Arial</button>
            <button onclick="changeFont('Georgia')">Georgia</button>
            <button onclick="changeFont('Courier New')">Courier New</button>

            <!-- Text Decoration -->
            <button onclick="toggleDecoration('underline')">Underline</button>
            <button onclick="toggleDecoration('overline')">Overline</button>
            <button onclick="toggleDecoration('line-through')">
                Line Through
            </button>

            <!-- Bold and Italic -->
            <button onclick="toggleBold()">Bold</button>
            <button onclick="toggleItalic()">Italic</button>

            <!-- Text Alignment -->
            <button onclick="alignText('left')">Left</button>
            <button onclick="alignText('center')">Center</button>
            <button onclick="alignText('right')">Right</button>

            <!-- Uppercase and Lowercase -->
            <button onclick="changeCase('uppercase')">UPPERCASE</button>
            <button onclick="changeCase('lowercase')">lowercase</button>

            <!-- Background Color -->
            <button onclick="changeBackground('yellow')">
                Yellow Background
            </button>
            <button onclick="changeBackground('lightblue')">
                Blue Background
            </button>
            <button onclick="changeBackground('pink')">
                Pink Background
            </button>

            <!-- Dark and Light Mode -->
            <button onclick="toggleMode()">Dark / Light Mode</button>

            <!-- Reset -->
            <button class="reset" onclick="resetText()">Reset</button>

        </div>
    </div>

    <script>
        // Get the text area
        const textArea = document.getElementById("textArea");

        // Store the original text
        const originalText = textArea.innerHTML;

        // Store the original styling
        const originalStyles = {
            color: textArea.style.color,
            fontSize: "20px",
            fontFamily: "Arial",
            textAlign: "center",
            backgroundColor: "#ffffff",
            fontWeight: "normal",
            fontStyle: "normal",
            textDecoration: "none",
            textTransform: "none"
        };

        // Change text color
        function changeColor(color) {
            textArea.style.color = color;
        }

        // Increase or decrease font size
        function changeSize(amount) {
            let currentSize = parseFloat(
                window.getComputedStyle(textArea).fontSize
            );

            let newSize = currentSize + amount;

            if (newSize >= 10 && newSize <= 60) {
                textArea.style.fontSize = newSize + "px";
            }
        }

        // Change font family
        function changeFont(font) {
            textArea.style.fontFamily = font;
        }

        // Apply or remove text decoration
        function toggleDecoration(decoration) {
            let currentDecorations =
                textArea.style.textDecoration
                    .split(" ")
                    .filter(item => item !== "none");

            if (currentDecorations.includes(decoration)) {
                currentDecorations = currentDecorations.filter(
                    item => item !== decoration
                );
            } else {
                currentDecorations.push(decoration);
            }

            textArea.style.textDecoration =
                currentDecorations.length > 0
                    ? currentDecorations.join(" ")
                    : "none";
        }

        // Toggle bold
        function toggleBold() {
            textArea.style.fontWeight =
                textArea.style.fontWeight === "bold"
                    ? "normal"
                    : "bold";
        }

        // Toggle italic
        function toggleItalic() {
            textArea.style.fontStyle =
                textArea.style.fontStyle === "italic"
                    ? "normal"
                    : "italic";
        }

        // Change text alignment
        function alignText(alignment) {
            textArea.style.textAlign = alignment;
        }

        // Convert text to uppercase or lowercase
        function changeCase(textCase) {
            textArea.style.textTransform = textCase;
        }

        // Change background color
        function changeBackground(color) {
            textArea.style.backgroundColor = color;
        }

        // Toggle dark and light mode
        function toggleMode() {
            document.body.classList.toggle("dark");
        }

        // Reset all styles and text
        function resetText() {
            textArea.innerHTML = originalText;

            textArea.style.color = originalStyles.color;
            textArea.style.fontSize = originalStyles.fontSize;
            textArea.style.fontFamily = originalStyles.fontFamily;
            textArea.style.textAlign = originalStyles.textAlign;
            textArea.style.backgroundColor =
                originalStyles.backgroundColor;
            textArea.style.fontWeight = originalStyles.fontWeight;
            textArea.style.fontStyle = originalStyles.fontStyle;
            textArea.style.textDecoration =
                originalStyles.textDecoration;
            textArea.style.textTransform =
                originalStyles.textTransform;

            document.body.classList.remove("dark");
        }
    </script>

</body>
</html>
